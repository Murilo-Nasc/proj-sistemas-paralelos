x-python: &python-base
  build:
    context: ./python
    dockerfile: Dockerfile
  image: chat-sd:python

x-java: &java-base
  build:
    context: ./java
    dockerfile: Dockerfile
  image: chat-sd:java

services:
  broker:
    <<: *python-base
    container_name: broker
    command: ["python", "broker.py"]

  servidor-py-1:
    <<: *python-base
    container_name: servidor-py-1
    command: ["python", "servidor.py"]
    environment:
      NOME_SERVIDOR: servidor-py-1
      DB_PATH: /data/servidor-py-1.db
      BROKER_HOST: broker
    volumes:
      - dados-servidor-py-1:/data
    depends_on:
      - broker

  servidor-py-2:
    <<: *python-base
    container_name: servidor-py-2
    command: ["python", "servidor.py"]
    environment:
      NOME_SERVIDOR: servidor-py-2
      DB_PATH: /data/servidor-py-2.db
      BROKER_HOST: broker
    volumes:
      - dados-servidor-py-2:/data
    depends_on:
      - broker

  cliente-py-1:
    <<: *python-base
    container_name: cliente-py-1
    command: ["python", "cliente.py"]
    environment:
      NOME_USUARIO: bot_py_1
      BROKER_HOST: broker
    depends_on:
      - broker
      - servidor-py-1
      - servidor-py-2
      - servidor-java-1
      - servidor-java-2

  cliente-py-2:
    <<: *python-base
    container_name: cliente-py-2
    command: ["python", "cliente.py"]
    environment:
      NOME_USUARIO: bot_py_2
      BROKER_HOST: broker
    depends_on:
      - broker
      - servidor-py-1
      - servidor-py-2
      - servidor-java-1
      - servidor-java-2

  servidor-java-1:
    <<: *java-base
    container_name: servidor-java-1
    command: ["java", "-jar", "/app/app.jar", "servidor"]
    environment:
      NOME_SERVIDOR: servidor-java-1
      DB_PATH: /data/servidor-java-1.db
      BROKER_HOST: broker
    volumes:
      - dados-servidor-java-1:/data
    depends_on:
      - broker

  servidor-java-2:
    <<: *java-base
    container_name: servidor-java-2
    command: ["java", "-jar", "/app/app.jar", "servidor"]
    environment:
      NOME_SERVIDOR: servidor-java-2
      DB_PATH: /data/servidor-java-2.db
      BROKER_HOST: broker
    volumes:
      - dados-servidor-java-2:/data
    depends_on:
      - broker

  cliente-java-1:
    <<: *java-base
    container_name: cliente-java-1
    command: ["java", "-jar", "/app/app.jar", "cliente"]
    environment:
      NOME_USUARIO: bot_java_1
      BROKER_HOST: broker
    depends_on:
      - broker
      - servidor-py-1
      - servidor-py-2
      - servidor-java-1
      - servidor-java-2

  cliente-java-2:
    <<: *java-base
    container_name: cliente-java-2
    command: ["java", "-jar", "/app/app.jar", "cliente"]
    environment:
      NOME_USUARIO: bot_java_2
      BROKER_HOST: broker
    depends_on:
      - broker
      - servidor-py-1
      - servidor-py-2
      - servidor-java-1
      - servidor-java-2

volumes:
  dados-servidor-py-1:
  dados-servidor-py-2:
  dados-servidor-java-1:
  dados-servidor-java-2:
